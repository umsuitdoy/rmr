[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmr"
version = "0.1.0"
description = "Read-Only Code Intelligence MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "jedi>=0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
rmr-desktop = "rmr.desktop_ui:main"
rmr-server = "rmr.app:main"
rmr-web = "rmr.web_cli:main"

[tool.hatch.build.targets.sdist]
exclude = [
    "/config/projects.yaml",
    "/.rmr",
]
